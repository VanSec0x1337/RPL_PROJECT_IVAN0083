{% extends 'mahasiswa/base.html' %}

{% block title %}Edit Mahasiswa{% endblock %}

{% block content %}
<section class="form-card">
    <h2>Edit Mahasiswa</h2>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field-group">
            <label for="nim">NIM</label>
            <input id="nim" type="text" name="nim" value="{{ mhs.nim }}" required>
        </div>

        <div class="field-group">
            <label for="nama">Nama</label>
            <input id="nama" type="text" name="nama" value="{{ mhs.nama }}" required>
        </div>

        <div class="field-group">
            <label for="programstudi">Program Studi</label>
            <input id="programstudi" type="text" name="programstudi" value="{{ mhs.programstudi }}" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{% url 'daftar_mahasiswa' %}" class="btn btn-secondary">Kembali</a>
        </div>
    </form>
</section>
{% endblock %}
