{% extends 'mahasiswa/base.html' %}

{% block title %}Tambah Mahasiswa{% endblock %}

{% block content %}
<section class="form-card">
    <h2>Tambah Mahasiswa</h2>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field-group">
            <label for="nim">NIM</label>
            <input id="nim" type="text" name="nim" value="{{ nim }}" placeholder="Masukkan NIM" required>
        </div>

        <div class="field-group">
            <label for="nama">Nama</label>
            <input id="nama" type="text" name="nama" value="{{ nama }}" placeholder="Masukkan Nama" required>
        </div>

        <div class="field-group">
            <label for="programstudi">Program Studi</label>
            <input id="programstudi" type="text" name="programstudi" value="{{ programstudi }}" placeholder="Masukkan Program Studi" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Simpan</button>
            <a href="{% url 'daftar_mahasiswa' %}" class="btn btn-secondary">Kembali</a>
        </div>
    </form>
</section>
{% endblock %}
